name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: '构建完成后发布到 GitHub Release（默认只构建并上传 artifact）'
        type: boolean
        default: false

permissions:
  contents: read

env:
  WV2_VERSION: 1.0.4314.35
  WV2_SHA256: 90778DEB1B77E36292828B4B5833C9255C27533F40E0DDD55891AE718944EDC4
  NSIS_SHA256: C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check tag, package.json and CHANGELOG agree
        id: check
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG_VERSION="${PKG_VERSION}"
          fi
          echo "package.json=${PKG_VERSION} tag=${TAG_VERSION}"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::tag ${TAG_VERSION} 与 package.json ${PKG_VERSION} 不一致"
            exit 1
          fi
          if ! grep -q "^## ${PKG_VERSION} — " docs/CHANGELOG.md; then
            echo "::error::CHANGELOG.md 没有 ## ${PKG_VERSION} 这一节"
            exit 1
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

  windows-build:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Cache WebView2 SDK / NSIS
        uses: actions/cache@v4
        with:
          path: |
            .tmp/wv2
            .tmp/nsis
          key: tools-wv2-${{ env.WV2_VERSION }}-nsis-3.11

      - name: Build C# host
        run: powershell -ExecutionPolicy Bypass -File host/build.ps1

      - name: Host smoke (7 checks)
        run: node scripts/host-smoke.mjs

      - name: Build installer and portable zip
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/installer.ps1
          powershell -ExecutionPolicy Bypass -File packaging/portable.ps1
          Get-FileHash release/Sidelight-*-win-x64-setup.exe -Algorithm SHA256 | Format-List
          Get-FileHash release/Sidelight-*-win-x64-portable.zip -Algorithm SHA256 | Format-List

      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: release/Sidelight-*-win-x64-setup.exe
          if-no-files-found: error

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release/Sidelight-*-win-x64-portable.zip
          if-no-files-found: error

  macos-build:
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Build macOS app
        run: bash host-mac/build.sh

      - name: Self-test (start server, GET /__doc)
        run: ./.tmp/mac/Sidelight.app/Contents/MacOS/SidelightMac --self-test

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: release/Sidelight-*-macos-*.zip
          if-no-files-found: error

  release:
    # tag push 一定发布；手动触发只有勾了 publish 才发布，默认只构建上传 artifact
    if: github.event_name == 'push' || inputs.publish
    needs: [preflight, windows-build, macos-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build SHA256SUMS and verify
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' \) -exec cp {} out/ \;
          cd out
          sha256sum * > "SHA256SUMS-${VERSION}.txt"
          cat "SHA256SUMS-${VERSION}.txt"
          sha256sum -c "SHA256SUMS-${VERSION}.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          name: Sidelight ${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          files: |
            out/*.exe
            out/*.zip
            out/SHA256SUMS-*.txt
          overwrite_files: true
          fail_on_unmatched_files: true
