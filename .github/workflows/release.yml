name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建/发布的 tag（例如 v0.30.0）'
        required: true
        type: string
      publish:
        description: '构建完成后发布到 GitHub Release（默认只构建并上传 artifact）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WV2_VERSION: 1.0.4314.35
  WV2_SHA256: 90778DEB1B77E36292828B4B5833C9255C27533F40E0DDD55891AE718944EDC4
  NSIS_SHA256: C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check tag, package.json and CHANGELOG agree
        id: check
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ "${TAG}" != "v${PKG_VERSION}" ]; then
            echo "::error::tag ${TAG} 与 package.json v${PKG_VERSION} 不一致"
            exit 1
          fi
          if ! grep -q "^## ${PKG_VERSION} — " docs/CHANGELOG.md; then
            echo "::error::CHANGELOG.md 没有 ## ${PKG_VERSION} 这一节"
            exit 1
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

  windows-build:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Cache WebView2 SDK / NSIS
        uses: actions/cache@v4
        with:
          path: |
            .tmp/wv2
            .tmp/nsis
          key: tools-wv2-${{ env.WV2_VERSION }}-nsis-3.11

      - name: Build C# host
        run: powershell -ExecutionPolicy Bypass -File host/build.ps1

      - name: Host smoke (7 checks)
        run: node scripts/host-smoke.mjs

      - name: Build installer and portable zip
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/installer.ps1
          powershell -ExecutionPolicy Bypass -File packaging/portable.ps1

      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: release/Sidelight-*-win-x64-setup.exe
          if-no-files-found: error

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release/Sidelight-*-win-x64-portable.zip
          if-no-files-found: error

  macos-build:
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      signing: ${{ steps.signing.outputs.signing }}
    defaults:
      run:
        shell: bash
    env:
      # 有 APPLE_SIGN_IDENTITY 就走签名/公证分支；条件里不直接引用 secrets
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_SIGN_IDENTITY != '' }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Build macOS app (universal)
        run: bash host-mac/build.sh

      - name: Sign and notarize (Developer ID)
        if: env.HAS_APPLE_SIGNING == 'true'
        run: bash host-mac/sign.sh ".tmp/mac/stage/Sidelight.app" ".tmp/mac/stage" "release/Sidelight-$(node -p "require('./package.json').version")-macos-universal.zip"

      - name: Record signing status
        id: signing
        run: |
          if [ "$HAS_APPLE_SIGNING" = "true" ]; then
            echo "signing=developer-id-notarized" >> "$GITHUB_OUTPUT"
          else
            echo "signing=adhoc" >> "$GITHUB_OUTPUT"
          fi

      - name: Self-test (bundle, 6 assertions)
        run: ./.tmp/mac/stage/Sidelight.app/Contents/MacOS/SidelightMac --self-test --require-bundle

      - name: Verify app bundle and zip
        run: bash host-mac/verify.sh ".tmp/mac/stage/Sidelight.app" "release/Sidelight-$(node -p "require('./package.json').version")-macos-universal.zip"

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: release/Sidelight-*-macos-universal.zip
          if-no-files-found: error



  release:
    # tag push 一定发布；手动触发只有勾了 publish 才发布，默认只构建上传 artifact
    if: github.event_name == 'push' || inputs.publish
    needs: [preflight, windows-build, macos-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SIGNING: ${{ needs.macos-build.outputs.signing }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Build SHA256SUMS for the three assets and verify
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"

          # download-artifact 会保留 artifact 名字目录；先摊平到 out/ 顶层，再按顶层文件名计算校验和。
          find out -mindepth 2 -type f \( -name '*.exe' -o -name '*.zip' \) -exec cp -n {} out/ \;
          rm -rf out/windows-setup out/windows-portable out/macos-zip

          SETUP="$(find out -maxdepth 1 -type f -name 'Sidelight-*-win-x64-setup.exe' | head -1)"
          WINZIP="$(find out -maxdepth 1 -type f -name 'Sidelight-*-win-x64-portable.zip' | head -1)"
          MACZIP="$(find out -maxdepth 1 -type f -name 'Sidelight-*-macos-universal.zip' | head -1)"
          for f in "$SETUP" "$WINZIP" "$MACZIP"; do
            [ -n "$f" ] && [ -f "$f" ] || { echo "::error::缺少发布资产"; exit 1; }
          done

          COUNT="$(find out -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' \) | wc -l | tr -d ' ')"
          [ "$COUNT" = "3" ] || { echo "::error::发布资产应为 3 个，实际 $COUNT"; exit 1; }

          (
            cd out
            sha256sum "$(basename "$SETUP")" "$(basename "$WINZIP")" "$(basename "$MACZIP")" > "SHA256SUMS-${VERSION}.txt"
            cat "SHA256SUMS-${VERSION}.txt"
          )

          FILES="$(find out -maxdepth 1 -type f | wc -l | tr -d ' ')"
          [ "$FILES" = "4" ] || { echo "::error::发布包应为 4 个文件（3 资产 + checksum），实际 $FILES"; exit 1; }

          ( cd out && sha256sum -c "SHA256SUMS-${VERSION}.txt" )
      - name: Generate release notes (six sections)
        shell: bash
        run: |
          node scripts/release-notes.mjs --dir out --out out/RELEASE_NOTES.md
          test -s out/RELEASE_NOTES.md
          for name in "Sidelight-${VERSION}-win-x64-setup.exe" "Sidelight-${VERSION}-win-x64-portable.zip" "Sidelight-${VERSION}-macos-universal.zip"; do
            grep -q "$name" out/RELEASE_NOTES.md || { echo "::error::RELEASE_NOTES.md 缺资产 $name"; exit 1; }
          done
        env:
          VERSION: ${{ needs.preflight.outputs.version }}

      - name: Remove stale arm64 assets from an earlier run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ needs.preflight.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets -q '.assets[].name' | grep -- '-macos-arm64.zip' | while read -r name; do
              gh release delete-asset "$TAG" "$name" -y || true
            done
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          name: Sidelight ${{ needs.preflight.outputs.version }}
          body_path: out/RELEASE_NOTES.md
          append_body: false
          files: |
            out/*.exe
            out/*.zip
            out/SHA256SUMS-*.txt
          overwrite_files: true
          fail_on_unmatched_files: true
