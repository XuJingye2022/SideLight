name: 功能建议
description: 提一个功能或改进（请先说明要解决什么问题）
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先说问题，再说方案。产品边界见 [README](../README.md) 与 [AGENTS.md](../AGENTS.md)。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      placeholder: 我在…时，总是要…，很费时间。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的提案

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案

  - type: textarea
    id: impact
    attributes:
      label: 影响面
      description: 会动到哪些文件/模块？是否影响保存、缓存、最近记录、导出或 macOS/Windows 宿主？

  - type: dropdown
    id: pr
    attributes:
      label: 是否愿意提 PR
      options:
        - 愿意
        - 可以试
        - 不
